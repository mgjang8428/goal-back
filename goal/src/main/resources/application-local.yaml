spring:
  application:
    name: goal
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localmemdb;MODE=MySQL;
    username: sa
    password:

    p6spy:
      enable-logging: true
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      default_batch_fetch_size: 1000
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    root: info